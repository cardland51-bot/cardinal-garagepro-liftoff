<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Checkout (Placeholder)</title>
<link rel="stylesheet" href="/styles.css"></head>
<body class="container">
  <h1>Hosted Checkout (Placeholder)</h1>
  <p>This is a stub page. Integrate with PayPal/Stripe hosted checkout and redirect back.</p>
  <form id="f">
    <label>Device ID (auto)</label>
    <input id="device" readonly>
    <label>Card ID</label>
    <input id="card" readonly>
    <label>Mode</label>
    <input id="mode" readonly>
    <button class="btn primary" type="button" id="complete">Simulate Success</button>
  </form>
  <script>
    const qs = new URLSearchParams(location.search);
    document.getElementById('card').value = qs.get('card') || '';
    document.getElementById('mode').value = qs.get('mode') || 'per_card';
    fetch('/api/me').then(r=>r.json()).then(m=> document.getElementById('device').value = m.device || m.deviceId || '');
    document.getElementById('complete').onclick = async () => {
      const payload = { type: 'payment.succeeded', data: { deviceId: document.getElementById('device').value, cardId: document.getElementById('card').value, mode: document.getElementById('mode').value } };
      await fetch('/api/payments/webhook', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      location.href = '/';
    };
  </script>
</body></html>
